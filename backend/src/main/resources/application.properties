spring.application.name=cybershield-backend
server.port=8080
server.address=127.0.0.1

# Database password lives in backend/local.properties, which is not shared
spring.config.import=optional:file:./local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/cybershield
spring.datasource.username=cybershield
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

ml.service.url=http://127.0.0.1:5000
