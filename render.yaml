databases:
  - name: cybershield-db
    plan: free
    region: singapore
    databaseName: cybershield
    user: cybershield

services:
  - type: web
    name: cybershield-ml-kvm555
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r ml-service/requirements.txt gunicorn
    startCommand: cd ml-service && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

  - type: web
    name: cybershield-ai-kvm555
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/stats
    envVars:
      # Free services cannot use the private network, so this is the public address
      - key: ML_SERVICE_URL
        value: https://cybershield-ml-kvm555.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: cybershield-db
          property: connectionString
